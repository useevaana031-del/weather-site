<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="color-scheme" content="dark">
<title>Weather Pro</title>
<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
<link rel="preconnect" href="https://nominatim.openstreetmap.org" crossorigin>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes growBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
:root{--card:rgba(255,255,255,.045);--card-hi:rgba(255,255,255,.075);--border:rgba(255,255,255,.08);--border-hi:rgba(94,184,255,.35);--text:#f0f4fa;--dim:#8b95a8;--mute:#5e6b85;--accent:#5eb8ff;--warn:#ffcc7a;--err:#ff7a7a}
body{min-height:100vh;background:linear-gradient(135deg,#0a1020,#070b14,#0d1424,#0a1020);background-size:300% 300%;animation:bgShift 80s ease infinite;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,Arial,sans-serif;display:flex;justify-content:center;align-items:flex-start;padding:20px 14px 80px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.container{width:100%;max-width:720px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:22px 24px;backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);box-shadow:0 20px 50px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05);animation:fadeUp .5s cubic-bezier(.16,1,.3,1) both;transition:border-color .3s ease}
.card:hover{border-color:var(--border-hi)}
.search-wrap{position:relative;z-index:50}
.search-bar{display:flex;gap:8px}
.search-input-wrap{flex:1;position:relative}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:15px;pointer-events:none}
#searchInput{width:100%;padding:14px 44px 14px 44px;background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:16px;color:var(--text);font-size:15px;font-family:inherit;outline:none;transition:all .25s ease}
#searchInput::placeholder{color:var(--mute)}
#searchInput:focus{border-color:rgba(94,184,255,.5);background:rgba(94,184,255,.06);box-shadow:0 0 0 4px rgba(94,184,255,.08)}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.08);border:none;color:var(--dim);cursor:pointer;font-size:15px;display:none;align-items:center;justify-content:center;font-family:inherit}
.search-clear.show{display:flex}
.search-clear:hover{background:rgba(255,122,122,.2);color:#ff9a9a}
.search-btn{padding:14px 20px;background:linear-gradient(135deg,rgba(94,184,255,.18),rgba(124,140,255,.1));border:1px solid rgba(94,184,255,.4);border-radius:16px;color:var(--accent);cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;touch-action:manipulation;transition:all .2s ease;flex-shrink:0}
.search-btn:hover{transform:translateY(-1px);background:linear-gradient(135deg,rgba(94,184,255,.25),rgba(124,140,255,.15))}
.search-btn:active{transform:scale(.97)}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:rgba(15,22,38,.98);border:1px solid var(--border);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.6);overflow:hidden;z-index:100;max-height:440px;overflow-y:auto;display:none;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.search-results.show{display:block;animation:fadeUp .2s ease}
.result-group-label{padding:8px 16px 4px;font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;background:rgba(0,0,0,.15)}
.result-item{padding:11px 16px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04);transition:background .15s ease;display:flex;gap:12px;align-items:flex-start}
.result-item:last-child{border-bottom:none}
.result-item:hover{background:rgba(94,184,255,.08)}
.result-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.result-body{flex:1;min-width:0}
.result-name{font-size:13.5px;font-weight:600;color:var(--text);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-detail{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-type{font-size:10.5px;color:var(--accent);background:rgba(94,184,255,.12);padding:2px 7px;border-radius:6px;font-weight:600;white-space:nowrap;align-self:flex-start}
.search-loading,.search-empty{padding:20px;text-align:center;color:var(--dim);font-size:13px;line-height:1.5}
.search-history{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.search-history:empty{display:none}
.search-history-label{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-right:4px}
.history-chip{padding:5px 11px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:20px;color:var(--dim);font-size:11.5px;cursor:pointer;font-family:inherit;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-chip:hover{background:rgba(94,184,255,.1);border-color:rgba(94,184,255,.3);color:var(--accent)}
.history-chip.spb{background:rgba(94,184,255,.12);border-color:rgba(94,184,255,.4);color:var(--accent);font-weight:600}
.header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.loc-info h1{font-size:30px;font-weight:700;letter-spacing:-.6px;line-height:1.15;background:linear-gradient(135deg,#fff 0%,#b8c5d6 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.loc-sub{font-size:12px;color:var(--mute);margin-top:6px;font-variant-numeric:tabular-nums}
.clock-block{text-align:right;flex-shrink:0}
.clock{font-size:30px;font-weight:200;color:#e5eaf3;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1}
.clock-date{font-size:12px;color:var(--dim);margin-top:5px}
.clock-updated{font-size:11px;color:var(--mute);margin-top:3px}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.btn{padding:11px 14px;background:var(--card);border:1px solid var(--border);border-radius:14px;color:#c5cdd9;font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;touch-action:manipulation;transition:all .2s ease}
.btn:hover{background:var(--card-hi);color:#fff;border-color:var(--border-hi);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,rgba(94,184,255,.15),rgba(124,140,255,.08));border-color:rgba(94,184,255,.35);color:var(--accent)}
.current-hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.hero-icon{width:100px;height:100px}
.hero-icon svg{width:100%;height:100%;display:block}
.hero-temp{font-size:74px;font-weight:200;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-3px}
.hero-desc{font-size:16px;color:#d5dde8;margin-top:8px;font-weight:500}
.hero-feels{font-size:13px;color:var(--dim);margin-top:4px}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:18px}
.metric{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05);border-radius:14px;padding:12px 14px}
.metric-label{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.metric-value{font-size:18px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums}
.metric-hint{font-size:11px;color:var(--dim);margin-top:3px}
.section-title{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:2px;margin-bottom:14px}
.hourly-scroll{display:flex;gap:4px;overflow-x:auto;padding:4px 0 12px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
.hourly-scroll::-webkit-scrollbar{height:3px}
.hourly-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
.hour-cell{flex-shrink:0;min-width:66px;padding:12px 6px;text-align:center;border-radius:14px}
.hour-cell.now{background:rgba(94,184,255,.12);border:1px solid rgba(94,184,255,.25)}
.hour-cell .time{font-size:11.5px;color:var(--dim);margin-bottom:8px;font-variant-numeric:tabular-nums}
.hour-cell.now .time{color:var(--accent);font-weight:700}
.hour-cell .icon{width:26px;height:26px;margin:0 auto 6px}
.hour-cell .icon svg{width:100%;height:100%;display:block}
.hour-cell .temp{font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums}
.hour-cell .rain{font-size:10px;color:var(--accent);margin-top:2px;font-variant-numeric:tabular-nums}
.day-item{display:grid;grid-template-columns:110px 34px 1fr 56px 90px;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13.5px}
.day-item:last-child{border-bottom:none}
.day-name{color:#d5dde8}
.day-name.today{color:var(--accent);font-weight:700}
.day-icon{width:28px;height:28px}
.day-icon svg{width:100%;height:100%;display:block}
.day-desc{color:var(--dim);font-size:12.5px}
.day-rain{color:var(--accent);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.day-temp{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.day-temp .min{color:var(--dim);font-weight:400;margin-right:6px;font-size:13px}
.moon-block{display:flex;gap:20px;align-items:center}
.moon-svg{width:70px;height:70px;flex-shrink:0}
.moon-info{flex:1}
.moon-name{font-size:15px;font-weight:600;margin-bottom:4px}
.moon-hint{font-size:12.5px;color:var(--dim);line-height:1.5}
.fishing-wrap{background:linear-gradient(135deg,rgba(74,217,160,.06),rgba(94,184,255,.03));border:1px solid rgba(74,217,160,.14);border-radius:16px;padding:16px 18px}
.fish-summary{display:flex;gap:14px;align-items:center;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid rgba(255,255,255,.06)}
.fish-score-big{font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.fish-score-text{font-size:12.5px;color:var(--dim);margin-top:4px}
.fish-score-label{font-size:15px;font-weight:600;margin-top:2px}
.fish-row{display:grid;grid-template-columns:130px 1fr 42px;gap:12px;align-items:center;padding:5px 0;font-size:12.5px}
.fish-row-name{color:#d5dde8}
.fish-row-bar{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.fish-row-bar-fill{height:100%;border-radius:3px;transform-origin:left center;animation:growBar .7s cubic-bezier(.16,1,.3,1) both}
.fish-row-score{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.saved-row{display:flex;flex-wrap:wrap;gap:6px}
.saved-chip{padding:8px 12px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;color:var(--dim);font-size:12.5px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.saved-chip:hover{background:rgba(94,184,255,.08);border-color:rgba(94,184,255,.3);color:var(--accent)}
.saved-chip.active{background:rgba(94,184,255,.15);border-color:rgba(94,184,255,.4);color:var(--accent);font-weight:600}
.saved-chip .del{background:transparent;border:none;color:inherit;opacity:.5;cursor:pointer;font-size:14px;padding:0;font-family:inherit}
.saved-chip .del:hover{opacity:1;color:var(--err)}
.saved-chip.locked .del{display:none}
.notice{padding:12px 16px;border-radius:12px;font-size:12.5px;line-height:1.5}
.notice.warn{background:rgba(255,184,74,.08);border:1px solid rgba(255,184,74,.22);color:var(--warn)}
.notice.err{background:rgba(255,100,100,.08);border:1px solid rgba(255,100,100,.22);color:#ff9a9a}
.notice button{display:block;margin-top:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:inherit;padding:7px 12px;border-radius:9px;font-family:inherit;font-size:12px;cursor:pointer}
.loading{text-align:center;color:var(--dim);padding:30px;font-size:13px}
@media (max-width:768px),(pointer:coarse){
body{animation:none;background:#070b14;background-image:radial-gradient(ellipse at top,#0f1a35 0%,#070b14 60%,#04060a 100%);padding:14px 10px 60px}
.card{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(255,255,255,.045);box-shadow:0 12px 30px rgba(0,0,0,.4);padding:18px 18px;border-radius:20px}
.loc-info h1{font-size:23px}
.clock{font-size:22px}
.hero-temp{font-size:58px;letter-spacing:-2px}
.hero-icon{width:80px;height:80px}
.current-hero{grid-template-columns:auto 1fr;gap:14px}
.metric-grid{grid-template-columns:1fr 1fr}
.day-item{grid-template-columns:76px 30px 1fr 52px}
.day-item .day-rain{display:none}
.fish-row{grid-template-columns:100px 1fr 36px;gap:8px;font-size:12px}
#searchInput{font-size:15px}
.search-btn{padding:14px 16px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}body{animation:none!important}}
</style>
</head>

<div style="display:flex;gap:14px;margin-top:14px;flex-wrap:wrap;font-size:12px;color:var(--dim)">

<span>Закат: <b style="color:#fff" id="sunset">--:--</b></span>
<span>День: <b style="color:#fff" id="dayLength">--</b></span>
</div>
</div>

<div class="card">
<div class="section-title">Почасовой прогноз · 7 дней</div>
<div id="hourly" class="hourly-scroll"><div class="loading">Загрузка...</div></div>
</div>

<div class="card">
<div class="section-title">Прогноз на 7 дней</div>
<div id="daily"><div class="loading">Загрузка...</div></div>
</div>

<div class="card">
<div class="section-title">Луна</div>
<div class="moon-block" id="moonBlock"><div class="loading">Загрузка...</div></div>
</div>

<div class="card">
<div class="section-title">Прогноз клёва</div>
<div id="fishing"><div class="loading">Загрузка...</div></div>
</div>

<div class="card">
<div class="section-title">Сохранённые места</div>
<div class="saved-row" id="savedRow"></div>
</div>

</div>

function descFor(code){code=toCode(code);if(code===0)return'Ясно';if(code===1)return'Малооблачно';if(code===2)return'Переменная облачность';if(code===3)return'Пасмурно';if(code===45)return'Туман';if(code===48)return'Изморозь';if(code>=51&&code<=57)return'Небольшой дождь';if(code===61)return'Небольшой дождь';if(code===63)return'Дождь';if(code===65)return'Сильный дождь';if(code===66||code===67)return'Ледяной дождь';if(code===68)return'Мокрый снег';if(code===71)return'Небольшой снег';if(code===73)return'Снег';if(code===75)return'Сильный снег';if(code===77)return'Снежная крупа';if(code===80)return'Небольшой ливень';if(code===81)return'Ливень';if(code===82)return'Сильный ливень';if(code===85||code===86)return'Снегопад';if(code===95)return'Гроза';if(code===96||code===99)return'Гроза с градом';return'Облачно'}
function severity(code){if(code===0)return 0;if(code===1)return 1;if(code===2)return 2;if(code===3)return 3;if(code===45||code===48)return 4;if(code>=51&&code<=57)return 5;if(code>=61&&code<=67)return 6;if(code>=71&&code<=77)return 7;if(code>=80&&code<=82)return 8;if(code>=85&&code<=86)return 9;if(code>=95)return 10;return 3}

function normalizeStr(s){return String(s||'').toLowerCase().trim().replace(/ё/g,'е').replace(/[^а-яa-z0-9\s\-]/g,' ')}
function searchPresets(q){var nq=normalizeStr(q);if(!nq)return[];var words=nq.split(/\s+/).filter(Boolean);var res=[];for(var i=0;i<PRESETS.length;i++){var p=PRESETS[i];var np=normalizeStr(p.name)+' '+normalizeStr(p.group||'');var match=true;for(var w=0;w<words.length;w++){if(np.indexOf(words[w])===-1){match=false;break}}
if(match)res.push(p)}return res.slice(0,15)}
function typeEmoji(type){if(type==='река')return'🌊';if(type==='озеро')return'💧';if(type==='залив')return'⚓';if(type==='город')return'🏙';if(type==='регион')return'📍';return'📌'}

function renderResults(items,isLocal){var el=document.getElementById('searchResults');if(!items.length){if(!isLocal){el.innerHTML='<div class="search-empty">Ничего не найдено.<br>Попробуй «Ладога», «Финский залив» или «Петрозаводск».</div>';el.classList.add('show')}
return}
var groups={},order=[];for(var i=0;i<items.length;i++){var it=items[i];if(!validCoord(it.lat,it.lon))continue;var g=it.group||it.type||'Результаты';if(!groups[g]){groups[g]=[];order.push(g)}
groups[g].push(it)}
var html='';for(var gi=0;gi<order.length;gi++){var g=order[gi];var arr=groups[g];if(order.length>1&&arr.length>1){html+='<div class="result-group-label">'+esc(g)+'</div>'}
for(var k=0;k<arr.length;k++){var it2=arr[k];var idx=items.indexOf(it2);html+='<div class="result-item" onclick=\'pickResult('+idx+')\'><div class="result-icon">'+(it2._emoji||typeEmoji(it2.type))+'</div><div class="result-body"><div class="result-name">'+esc(it2.name)+'</div>'+(it2.detail?'<div class="result-detail">'+esc(it2.detail)+'</div>':'')+'</div><div class="result-type">'+esc(it2.type||'место')+'</div></div>'}}
el.innerHTML=html;el.classList.add('show');window.__results=items}

async function runNominatimSearch(q,localItems){if(searchAbort)searchAbort.abort();var ctrl=new AbortController();searchAbort=ctrl;
try{var url='https://nominatim.openstreetmap.org/search?format=jsonv2&q='+encodeURIComponent(q)+'&limit=8&accept-language=ru&addressdetails=1';var r=await fetch(url,{signal:ctrl.signal});var data=await r.json();var remote=[];
for(var i=0;i<data.length;i++){var it=data[i];var la=parseFloat(it.lat),lo=parseFloat(it.lon);if(!validCoord(la,lo))continue;var name=it.name||(it.display_name||'').split(',')[0];var addr=it.address||{};var region=addr.state||addr.region||addr.county||'';var district=addr.city_district||addr.district||'';var detailParts=[];if(district&&district!==name)detailParts.push(district);if(region)detailParts.push(region);if(!region&&it.display_name){var dn=(it.display_name||'').split(',').slice(1,3).join(',').trim();if(dn)detailParts.push(dn)}
var detail=detailParts.join(' · ').slice(0,90);var cls=it.class||it.category||'';var type=it.type||'';var typeLabel='';if(cls==='waterway')typeLabel='река';else if(cls==='natural'&&(type==='water'||type==='bay'))typeLabel=type==='bay'?'залив':'озеро';else if(cls==='place'){if(type==='city'||type==='town')typeLabel='город';else if(type==='village'||type==='hamlet')typeLabel='посёлок';else if(type==='state')typeLabel='регион';else typeLabel='населённый пункт'}else if(cls==='boundary')typeLabel='регион';else typeLabel='место';remote.push({name:name,lat:la,lon:lo,type:typeLabel,_emoji:typeEmoji(typeLabel),detail:detail})}
var merged=[],seen={};function key(x){return normalizeStr(x.name)+'|'+x.lat.toFixed(3)+'|'+x.lon.toFixed(3)}
for(var l=0;l<localItems.length;l++){var k=key(localItems[l]);if(!seen[k]){seen[k]=1;merged.push(localItems[l])}}
for(var m=0;m<remote.length;m++){var k2=key(remote[m]);if(!seen[k2]){seen[k2]=1;merged.push(remote[m])}}
renderResults(merged.slice(0,16),false)}catch(e){if(e.name!=='AbortError'&&!localItems.length){document.getElementById('searchResults').innerHTML='<div class="search-empty">Ошибка поиска.</div>';document.getElementById('searchResults').classList.add('show')}}}

function checkGeoPerm(cb){if(!navigator.permissions||!navigator.permissions.query){cb('unknown');return}navigator.permissions.query({name:'geolocation'}).then(function(p){cb(p.state);p.onchange=function(){checkGeoPerm(cb)}}).catch(function(){cb('unknown')})}
function renderGeoBox(state){if(state==='denied'){geoBox.innerHTML='<div class="card notice warn"><b>Геолокация отключена</b><br>iPhone: Настройки → Safari → Геопозиция → Разрешить.<br>Android: Настройки браузера → Разрешения → Геолокация → Разрешить.<button onclick="retryGeo()">Проверить снова</button></div>'}else{geoBox.innerHTML=''}}
function retryGeo(){checkGeoPerm(function(s){renderGeoBox(s);if(s==='granted')detectLocation()})}
function detectLocation(){if(!navigator.geolocation){alert('Геолокация не поддерживается');return}

lat=la;lon=lo;updateCoords();geoBox.innerHTML='';document.getElementById('searchResults').classList.remove('show');loadWeather(true);
if(inSpbBox(lat,lon)){cityNameEl.textContent='Санкт-Петербург';document.getElementById('searchInput').value='Санкт-Петербург';document.getElementById('searchClear').classList.add('show');addToHistory({name:'Санкт-Петербург',lat:lat,lon:lon})}else{reverseGeocode(lat,lon,function(name){cityNameEl.textContent=name;document.getElementById('searchInput').value=name;document.getElementById('searchClear').classList.add('show');addToHistory({name:name,lat:lat,lon:lon})})}
},function(err){if(err.code===1)checkGeoPerm(function(s){renderGeoBox(s)});else alert('Не удалось определить')},{enableHighAccuracy:true,timeout:15000,maximumAge:60000})}
function reverseGeocode(la,lo,cb){var key=GEO_PREFIX+la.toFixed(3)+'_'+lo.toFixed(3);try{var c=localStorage.getItem(key);if(c){var p=JSON.parse(c);if(p&&p.n&&Date.now()-p.ts<86400000){cb(p.n);return}}}catch(e){}
var url='https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat='+la+'&lon='+lo+'&zoom=10&accept-language=ru';fetchT(url,4000).then(function(r){return r.json()}).then(function(d){var n='Моё местоположение';if(d&&d.address){var a=d.address;n=a.city||a.town||a.village||a.municipality||a.county||a.state||n}try{localStorage.setItem(key,JSON.stringify({n:n,ts:Date.now()}))}catch(e){}cb(n)}).catch(function(){cb('Моё местоположение')})}

async function fetchOneModel(model){var url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon
+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m,pressure_msl,uv_index,cloud_cover,dew_point_2m,precipitation'
+'&hourly=temperature_2m,weather_code,precipitation_probability,precipitation,wind_speed_10m,wind_gusts_10m,pressure_msl,relative_humidity_2m,apparent_temperature,cloud_cover,uv_index,dew_point_2m'
+'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset'
+'&timezone=auto&forecast_days=7&forecast_hours=168';
if(model&&model!=='best_match')url+='&models='+model;
var r=await fetchT(url,TIMEOUT);if(!r.ok)throw new Error('HTTP '+r.status);var d=await r.json();if(d.reason)throw new Error(d.reason);return d}

async function fetchEnsemble(){var results=await Promise.all([settled(fetchOneModel('ecmwf_ifs04')),settled(fetchOneModel('icon_seamless')),settled(fetchOneModel('gfs_seamless'))]);
var ok=[],names=[],weights=[];var allNames=['ECMWF','ICON','GFS'];var allWeights=[0.45,0.35,0.20];
for(var i=0;i<results.length;i++){if(results[i].ok){ok.push(results[i].v);names.push(allNames[i]);weights.push(allWeights[i])}}
if(!ok.length)throw new Error('Все модели упали');
if(ok.length===1)return{data:ok[0],models:names,source:'Open-Meteo'};
var sumW=0;for(var k=0;k<weights.length;k++)sumW+=weights[k];var norm=weights.map(function(w){return w/sumW});
return{data:blendModels(ok,norm),models:names,source:'Ансамбль'}}

function blendModels(models,weights){var n=models.length,base=models[0];
function wavg(f){var s=0;for(var i=0;i<n;i++){var v=f(models[i]);if(isNum(v))s+=v*weights[i]}return s}
function worst(field){var codes=[];for(var i=0;i<n;i++){var v=field(models[i]);if(isNum(v))codes.push(v)}var w=0;for(var k=0;k<codes.length;k++)if(severity(codes[k])>severity(w))w=codes[k];return w}
var current={time:base.current.time,
temperature_2m:wavg(function(m){return m.current.temperature_2m}),
apparent_temperature:wavg(function(m){return m.current.apparent_temperature}),
relative_humidity_2m:wavg(function(m){return m.current.relative_humidity_2m}),
wind_speed_10m:wavg(function(m){return m.current.wind_speed_10m}),
wind_gusts_10m:wavg(function(m){return m.current.wind_gusts_10m}),
wind_direction_10m:base.current.wind_direction_10m,
pressure_msl:wavg(function(m){return m.current.pressure_msl}),
uv_index:wavg(function(m){return m.current.uv_index}),
cloud_cover:wavg(function(m){return m.current.cloud_cover}),
dew_point_2m:wavg(function(m){return m.current.dew_point_2m}),
precipitation:wavg(function(m){return m.current.precipitation}),
weather_code:worst(function(m){return m.current.weather_code})};

var hLen=base.hourly.time.length;
var hourly={time:[],temperature_2m:[],weather_code:[],precipitation_probability:[],precipitation:[],wind_speed_10m:[],wind_gusts_10m:[],pressure_msl:[],relative_humidity_2m:[],apparent_temperature:[],cloud_cover:[],uv_index:[],dew_point_2m:[]};
var keysH=['temperature_2m','precipitation_probability','precipitation','wind_speed_10m','wind_gusts_10m','pressure_msl','relative_humidity_2m','apparent_temperature','cloud_cover','uv_index','dew_point_2m'];
for(var hi=0;hi<hLen;hi++){hourly.time.push(base.hourly.time[hi]);
for(var kh=0;kh<keysH.length;kh++){var key=keysH[kh];hourly[key].push(wavg((function(k){return function(m){return m.hourly&&m.hourly[k]?m.hourly[k][hi]:null}})(key)))}
hourly.weather_code.push(worst(function(m){return m.hourly&&m.hourly.weather_code?m.hourly.weather_code[hi]:0}))}

var dLen=base.daily.time.length;
var daily={time:[],weather_code:[],temperature_2m_max:[],temperature_2m_min:[],precipitation_probability_max:[],sunrise:[],sunset:[]};
for(var di=0;di<dLen;di++){daily.time.push(base.daily.time[di]);
daily.weather_code.push(worst(function(m){return m.daily&&m.daily.weather_code?m.daily.weather_code[di]:0}));
daily.temperature_2m_max.push(wavg(function(m){return m.daily.temperature_2m_max?m.daily.temperature_2m_max[di]:null}));
daily.temperature_2m_min.push(wavg(function(m){return m.daily.temperature_2m_min?m.daily.temperature_2m_min[di]:null}));
daily.precipitation_probability_max.push(wavg(function(m){return m.daily.precipitation_probability_max?m.daily.precipitation_probability_max[di]:0}));
daily.sunrise.push(base.daily.sunrise[di]);daily.sunset.push(base.daily.sunset[di])}
return{current:current,hourly:hourly,daily:daily}}

/* ================= MOON ================= */
function moonPhase(date){var d=date||new Date();var y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();
var jd=367*y-Math.floor(7*(y+Math.floor((m+9)/12))/4)+Math.floor(275*m/9)+day+1721013.5;
var daysSince=jd-2451549.5;var syn=29.530588853;
var age=((daysSince%syn)+syn)%syn;
var illum=(1-Math.cos(2*Math.PI*age/syn))/2;var phase=age/syn;
var names=[{max:0.03,name:'Новолуние',hint:'Рыба активна, но мало'},{max:0.22,name:'Растущий серп',hint:'Хороший клёв'},{max:0.28,name:'Первая четверть',hint:'Средний клёв'},{max:0.47,name:'Растущая луна',hint:'Хороший клёв'},{max:0.53,name:'Полнолуние',hint:'Слабый клёв'},{max:0.72,name:'Убывающая луна',hint:'Хороший клёв'},{max:0.78,name:'Последняя четверть',hint:'Средний клёв'},{max:0.97,name:'Убывающий серп',hint:'Хороший клёв'},{max:1.01,name:'Новолуние',hint:'Рыба активна, но мало'}];
var nn=names[names.length-1];for(var i=0;i<names.length;i++)if(phase<=names[i].max){nn=names[i];break}
return{age:age,illum:illum,phase:phase,name:nn.name,hint:nn.hint}}

/* ================= HINTS ================= */
function uvHint(uv){if(!isNum(uv))return'--';if(uv<3)return'Низкий';if(uv<6)return'Умеренный, SPF 15+';if(uv<8)return'Высокий, SPF 30+';if(uv<11)return'Очень высокий';return'Экстремальный'}
function windDir(d){if(!isNum(d))return'';var dirs=['С','СВ','В','ЮВ','Ю','ЮЗ','З','СЗ'];return dirs[Math.round(d/45)%8]}
function pressureTrend(hourly){if(!hourly||!hourly.pressure_msl)return{text:'',hint:''};var a=hourly.pressure_msl.slice(0,4).filter(isNum);if(a.length<2)return{text:'',hint:''};var diff=a[a.length-1]-a[0];if(Math.abs(diff)<0.8)return{text:'→',hint:'Стабильное'};if(diff>0)return{text:'↑',hint:'Растёт'};return{text:'↓',hint:'Падает'}}
function cloudsHint(c){if(!isNum(c))return'';if(c<15)return'Ясно';if(c<40)return'Небольшая';if(c<70)return'Значительная';return'Сплошная'}

document.getElementById('daily').innerHTML=html||'<div class="loading">Нет данных</div>'}

function renderMoon(){var m=moonPhase(new Date());var illum=m.illum;var waxing=m.phase<0.5;var phase=m.phase;
var svg='<svg viewBox="0 0 70 70" xmlns="http://www.w3.org/2000/svg">';svg+='<circle cx="35" cy="35" r="28" fill="#2a3a52"/>';
var k=Math.cos(2*Math.PI*phase);var rx=Math.abs(k)*28;
if(illum<0.03)svg+='<circle cx="35" cy="35" r="28" fill="#3a4a62" opacity="0.4"/>';
else if(illum>0.97)svg+='<circle cx="35" cy="35" r="28" fill="#e8eaf0"/>';
else{if(waxing)svg+='<path d="M35 7 A28 28 0 0 1 35 63 A'+rx+' 28 0 0 0 35 7 Z" fill="#e8eaf0"/>';else svg+='<path d="M35 7 A28 28 0 0 0 35 63 A'+rx+' 28 0 0 1 35 7 Z" fill="#e8eaf0"/>'}
svg+='</svg>';
document.getElementById('moonBlock').innerHTML='<div class="moon-svg">'+svg+'</div><div class="moon-info"><div class="moon-name">'+m.name+'</div><div class="moon-hint">Освещённость: <b>'+Math.round(illum*100)+'%</b><br>Возраст: '+Math.round(m.age)+' дн.<br>'+m.hint+'</div></div>'}

function scoreFish(f,temp,press,wind,month,moon){var s=0;
if(temp>=f.tMin&&temp<=f.tMax)s+=40;else if(temp>=f.tMin-3&&temp<=f.tMax+3)s+=20;else s+=3;
if(f.press==='stable'){if(press>=1010&&press<=1025)s+=25;else if(press>=1000&&press<=1030)s+=12;else s+=3}else{if(press>=1000&&press<=1030)s+=22;else s+=10}
if(wind<=f.windMax*0.5)s+=12;else if(wind<=f.windMax)s+=6;else s+=2;
if(f.active.indexOf(month)>=0)s+=10;
if(moon){if(f.moon==='any')s+=5;else if(f.moon==='good_new'&&moon.illum<0.25)s+=8;else if(f.moon==='good_full'&&moon.illum>0.75)s+=8;else if(f.moon==='good_waning'&&moon.phase>0.5)s+=8;else s+=2}
return Math.max(0,Math.min(100,Math.round(s)))}
function scoreColor(s){if(s>=80)return'#4ad9a0';if(s>=60)return'#8ee86a';if(s>=40)return'#ffcc7a';if(s>=20)return'#ff9a5e';return'#ff7a7a'}
function scoreLabel(s){if(s>=80)return'Отличный клёв';if(s>=60)return'Хороший клёв';if(s>=40)return'Средний клёв';if(s>=20)return'Слабый клёв';return'Плохой клёв'}
function fishBar(s){if(s>=80)return'linear-gradient(90deg,#3ac48a,#4ad9a0)';if(s>=60)return'linear-gradient(90deg,#6dc75a,#8ee86a)';if(s>=40)return'linear-gradient(90deg,#e8b45a,#ffcc7a)';if(s>=20)return'linear-gradient(90deg,#e87a4a,#ff9a5e)';return'linear-gradient(90deg,#e05555,#ff7a7a)'}

function renderFishing(c){var temp=isNum(c.temperature_2m)?c.temperature_2m:15;var press=isNum(c.pressure_msl)?c.pressure_msl:1013;var wind=isNum(c.wind_speed_10m)?c.wind_speed_10m:3;
var month=new Date().getMonth()+1;var moon=moonPhase(new Date());
var scored=FISH.map(function(f){return{name:f.name,score:scoreFish(f,temp,press,wind,month,moon)}}).sort(function(a,b){return b.score-a.score});
var avg=0;for(var i=0;i<Math.min(5,scored.length);i++)avg+=scored[i].score;avg=Math.round(avg/Math.min(5,scored.length));
var html='<div class="fishing-wrap">';
html+='<div class="fish-summary"><div><div class="fish-score-big" style="color:'+scoreColor(avg)+'">'+avg+'</div><div class="fish-score-text">средний клёв</div></div><div style="flex:1"><div class="fish-score-label" style="color:'+scoreColor(avg)+'">'+scoreLabel(avg)+'</div><div style="font-size:12px;color:var(--dim);margin-top:4px">Темп '+Math.round(temp)+'° · Давл '+Math.round(press)+' гПа · Ветер '+Math.round(wind)+' м/с · '+moon.name+'</div></div></div>';
for(var k=0;k<scored.length;k++){var f=scored[k];html+='<div class="fish-row"><span class="fish-row-name">'+f.name+'</span><div class="fish-row-bar"><div class="fish-row-bar-fill" style="width:'+f.score+'%;background:'+fishBar(f.score)+'"></div></div><span class="fish-row-score" style="color:'+scoreColor(f.score)+'">'+f.score+'</span></div>'}

async function loadWeather(force){if(!force&&document.hidden)return;if(!force&&lastUpdateMs&&(Date.now()-lastUpdateMs)<300000){updateLastUpdated();return}

return}
