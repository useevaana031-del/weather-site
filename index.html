<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Погода и Клёв | Санкт-Петербург</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        min-height: 100vh;
        background: radial-gradient(ellipse at top, #1a2440 0%, #0a0e1a 50%, #050810 100%);
        color: #f5f7fa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 24px 16px;
        -webkit-font-smoothing: antialiased;
    }
    .container {
        width: 100%;
        max-width: 720px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 28px;
        padding: 28px 26px;
        box-shadow: 0 24px 60px rgba(0,0,0,0.5);
        backdrop-filter: blur(20px);
    }
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
    }
    h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.6px; }
    .date { font-size: 13px; color: #8b95a8; margin-bottom: 22px; }
    .icon-refresh {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.08);
        width: 40px;
        height: 40px;
        border-radius: 12px;
        color: #c5cdd9;
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .icon-refresh:hover { background: rgba(255,255,255,0.1); }

    .current {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: linear-gradient(135deg, rgba(94,184,255,0.08), rgba(124,140,255,0.04));
        border: 1px solid rgba(94,184,255,0.12);
        padding: 22px 24px;
        border-radius: 22px;
        margin-bottom: 24px;
        flex-wrap: wrap;
        gap: 18px;
    }
    .current-left { display: flex; align-items: center; gap: 18px; }
    .current-icon { font-size: 72px; line-height: 1; }
    .current-temp { font-size: 56px; font-weight: 200; line-height: 1; letter-spacing: -2px; }
    .current-desc { font-size: 14px; color: #c5cdd9; margin-top: 6px; }
    .current-right {
        display: grid;
        gap: 8px;
        font-size: 12.5px;
        color: #8b95a8;
        min-width: 170px;
    }
    .current-right .row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
    }
    .current-right .row span:last-child { color: #fff; font-weight: 600; }

    .section-title {
        font-size: 11.5px;
        font-weight: 600;
        color: #8b95a8;
        text-transform: uppercase;
        letter-spacing: 1.4px;
        margin: 22px 0 14px;
    }

    .hourly {
        display: flex;
        overflow-x: auto;
        gap: 4px;
        padding: 4px 0 10px;
    }
    .hourly::-webkit-scrollbar { height: 3px; }
    .hourly::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
    .hour-item {
        flex-shrink: 0;
        text-align: center;
        min-width: 62px;
        padding: 12px 6px;
        border-radius: 14px;
    }
    .hour-item.now {
        background: rgba(94,184,255,0.12);
        border: 1px solid rgba(94,184,255,0.2);
    }
    .hour-item .h-time { font-size: 11.5px; color: #8b95a8; margin-bottom: 8px; }
    .hour-item.now .h-time { color: #5eb8ff; font-weight: 600; }
    .hour-item .h-icon { font-size: 22px; margin-bottom: 6px; display: block; }
    .hour-item .h-temp { font-size: 14px; font-weight: 600; }

    .week-list {
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 16px;
        padding: 4px 14px;
    }
    .day-row {
        display: grid;
        grid-template-columns: 100px 38px 1fr 60px 76px;
        align-items: center;
        padding: 13px 0;
        border-bottom: 1px solid rgba(255,255,255,0.04);
        gap: 10px;
        font-size: 13.5px;
    }
    .day-row:last-child { border-bottom: none; }
    .day-name { color: #c5cdd9; }
    .day-name.today { color: #5eb8ff; font-weight: 700; }
    .day-icon { font-size: 22px; text-align: center; }
    .day-desc { color: #8b95a8; font-size: 12.5px; }
    .day-rain { color: #5eb8ff; font-size: 12px; text-align: right; }
    .day-temp { text-align: right; font-weight: 600; }
    .day-temp .min { color: #8b95a8; font-weight: 400; margin-right: 8px; }

    .fish-block {
        background: linear-gradient(135deg, rgba(74,217,160,0.06), rgba(94,184,255,0.04));
        border: 1px solid rgba(74,217,160,0.12);
        border-radius: 16px;
        padding: 16px 18px;
        margin-bottom: 10px;
        font-size: 13px;
    }
    .fish-block .ft { font-weight: 700; margin-bottom: 12px; font-size: 14.5px; display: flex; align-items: center; justify-content: space-between; }
    .fish-row {
        display: flex;
        justify-content: space-between;
        padding: 5px 0;
        color: #8b95a8;
        font-size: 12.5px;
    }
    .fish-row span:last-child { color: #fff; font-weight: 600; }
    .fish-status {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 700;
    }

    .loading { text-align: center; color: #8b95a8; padding: 20px; font-size: 13px; }
    .error-box {
        background: rgba(255,100,100,0.08);
        border: 1px solid rgba(255,100,100,0.2);
        color: #ff9a9a;
        padding: 14px 16px;
        border-radius: 14px;
        text-align: center;
        margin-bottom: 18px;
        font-size: 13px;
    }
    .note-box {
        background: rgba(255,184,74,0.08);
        border: 1px solid rgba(255,184,74,0.2);
        color: #ffcc7a;
        padding: 10px 14px;
        border-radius: 12px;
        text-align: center;
        margin-bottom: 14px;
        font-size: 12.5px;
    }
    @media (max-width: 560px) {
        .container { padding: 22px 18px; }
        h1 { font-size: 22px; }
        .current { flex-direction: column; text-align: center; }
        .current-left { flex-direction: column; gap: 8px; }
        .current-icon { font-size: 60px; }
        .current-temp { font-size: 48px; }
        .current-right { width: 100%; text-align: left; }
        .day-row { grid-template-columns: 76px 30px 1fr 52px; font-size: 12.5px; gap: 6px; }
        .day-desc { display: none; }
    }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1 id="cityName">Санкт-Петербург</h1>
        <button class="icon-refresh" onclick="loadWeather()">R</button>
    </div>
    <div class="date" id="currentDate">Загрузка...</div>

    <div id="statusBox"></div>
    <div id="errorMessage" class="error-box" style="display: none;"></div>

    <div class="current">
        <div class="current-left">
            <div class="current-icon" id="currentIcon">*</div>
            <div>
                <div class="current-temp" id="currentTemp">--</div>
                <div class="current-desc" id="currentDesc">Загрузка...</div>
            </div>
        </div>
        <div class="current-right">
            <div class="row"><span>Ощущается</span><span id="feelsLike">--</span></div>
            <div class="row"><span>Влажность</span><span id="humidity">--</span></div>
            <div class="row"><span>Ветер</span><span id="windSpeed">--</span></div>
            <div class="row"><span>Давление</span><span id="pressure">--</span></div>
            <div class="row"><span>УФ-индекс</span><span id="uvIndex">--</span></div>
            <div class="row"><span>Восход</span><span id="sunrise">--:--</span></div>
            <div class="row"><span>Закат</span><span id="sunset">--:--</span></div>
        </div>
    </div>

    <div class="section-title">Почасовой прогноз (48 часов)</div>
    <div id="hourly" class="hourly"><div class="loading">Загрузка...</div></div>

    <div class="section-title">Прогноз на 7 дней</div>
    <div id="forecastList" class="week-list"><div class="loading">Загрузка...</div></div>

    <div class="section-title">Прогноз клёва</div>
    <div id="fishing"><div class="loading">Загрузка...</div></div>
</div>

<script>
var lat = 59.9386;
var lon = 30.3141;
var cityName = document.getElementById('cityName');
var statusBox = document.getElementById('statusBox');
var errorBox = document.getElementById('errorMessage');
var CACHE_KEY = 'weather_cache_v3';

function showStatus(text, type) {
    if (!text) { statusBox.innerHTML = ''; return; }
    var cls = (type === 'warn') ? 'note-box' : 'error-box';
    statusBox.innerHTML = '<div class="' + cls + '">' + text + '</div>';
}

function fetchWithTimeout(url, ms) {
    return new Promise(function(resolve, reject) {
        var timer = setTimeout(function() {
            reject(new Error('timeout'));
        }, ms);
        fetch(url).then(function(res) {
            clearTimeout(timer);
            resolve(res);
        }).catch(function(err) {
            clearTimeout(timer);
            reject(err);
        });
    });
}

function getWeatherIcon(code) {
    if (code === 0) return '☀';
    if (code === 1) return '🌤';
    if (code === 2) return '⛅';
    if (code === 3) return '☁';
    if (code === 45 || code === 48) return '🌫';
    if (code >= 51 && code <= 57) return '🌦';
    if (code >= 61 && code <= 67) return '🌧';
    if (code >= 71 && code <= 77) return '❄';
    if (code >= 80 && code <= 82) return '🌧';
    if (code >= 85 && code <= 86) return '❄';
    if (code >= 95) return '⛈';
    return '·';
}

function getWeatherDesc(code) {
    if (code === 0) return 'Ясно';
    if (code === 1) return 'Малооблачно';
    if (code === 2) return 'Переменная облачность';
    if (code === 3) return 'Пасмурно';
    if (code === 45 || code === 48) return 'Туман';
    if (code >= 51 && code <= 57) return 'Морось';
    if (code >= 61 && code <= 67) return 'Дождь';
    if (code >= 71 && code <= 77) return 'Снег';
    if (code >= 80 && code <= 82) return 'Ливень';
    if (code >= 85 && code <= 86) return 'Снегопад';
    if (code >= 95) return 'Гроза';
    return 'Неизвестно';
}

function formatTime(iso) {
    if (!iso) return '--:--';
    return iso.slice(11, 16);
}

function updateDate() {
    var now = new Date();
    var days = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
    var months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    document.getElementById('currentDate').textContent =
        days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()];
}

function saveCache(data, source) {
    try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({
            data: data,
            source: source,
            timestamp: Date.now(),
            city: cityName.textContent
        }));
    } catch (e) {}
}

function loadCache() {
    try {
        var raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
    } catch (e) { return null; }
}

// ==== ИСТОЧНИК ПОГОДЫ ====
async function fetchFromOpenMeteo() {
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon
        + '&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,pressure_msl,uv_index'
        + '&hourly=temperature_2m,weather_code,precipitation_probability'
        + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset'
        + '&timezone=auto&forecast_days=7';

    var res = await fetchWithTimeout(url, 8000);
    if (!res.ok) throw new Error('Open-Meteo: HTTP ' + res.status);
    var data = await res.json();
    return { source: 'Open-Meteo', data: normalizeOpenMeteo(data) };
}

function normalizeOpenMeteo(d) {
    return {
        current: {
            temp: d.current.temperature_2m,
            feels: d.current.apparent_temperature,
            code: d.current.weather_code,
            humidity: d.current.relative_humidity_2m,
            wind: d.current.wind_speed_10m,
            pressure: d.current.pressure_msl,
            uv: d.current.uv_index
        },
        hourly: d.hourly.time.map(function(t, i) {
            return {
                time: t,
                temp: d.hourly.temperature_2m[i],
                code: d.hourly.weather_code[i],
                rain: d.hourly.precipitation_probability ? d.hourly.precipitation_probability[i] : 0
            };
        }),
        daily: d.daily.time.map(function(t, i) {
            return {
                time: t,
                code: d.daily.weather_code[i],
                max: d.daily.temperature_2m_max[i],
                min: d.daily.temperature_2m_min[i],
                rain: d.daily.precipitation_probability_max[i],
                sunrise: d.daily.sunrise[i],
                sunset: d.daily.sunset[i]
            };
        })
    };
}

async function loadWeather() {
    updateDate();
    errorBox.style.display = 'none';
    showStatus('', '');

    var result = null;
    var errors = [];

    try {
        result = await fetchFromOpenMeteo();
    } catch (e) {
        errors.push('Open-Meteo: ' + e.message);
    }

    if (!result) {
        var cached = loadCache();
        if (cached) {
            var ageMin = Math.round((Date.now() - cached.timestamp) / 60000);
            if (cached.city) cityName.textContent = cached.city;
            renderAll(cached.data);
            showStatus('Нет связи. Данные ' + ageMin + ' мин назад (' + cached.source + ').', 'warn');
        } else {
            errorBox.style.display = 'block';
            errorBox.textContent = 'Не удалось получить данные. Проверь интернет.';
        }
        return;
    }

    renderAll(result.data);
    saveCache(result.data, result.source);
}

function renderAll(data) {
    var cur = data.current;

    document.getElementById('currentIcon').textContent = getWeatherIcon(cur.code);
    document.getElementById('currentTemp').textContent = Math.round(cur.temp) + '°';
    document.getElementById('currentDesc').textContent = getWeatherDesc(cur.code);
    document.getElementById('feelsLike').textContent = Math.round(cur.feels) + '°';
    document.getElementById('humidity').textContent = Math.round(cur.humidity) + '%';
    document.getElementById('windSpeed').textContent = Math.round(cur.wind) + ' м/с';
    document.getElementById('pressure').textContent = Math.round(cur.pressure) + ' гПа';
    document.getElementById('uvIndex').textContent = (cur.uv !== null && cur.uv !== undefined && !isNaN(cur.uv)) ? cur.uv : '--';

    if (data.daily && data.daily[0]) {
        document.getElementById('sunrise').textContent = (data.daily[0].sunrise || '').slice(11, 16);
        document.getElementById('sunset').textContent = (data.daily[0].sunset || '').slice(11, 16);
    }

    var nowTime = new Date();
    var hourlyHTML = '';
    var count = 0;
    for (var i = 0; i < data.hourly.length && count < 48; i++) {
        var h = data.hourly[i];
        var hDate = new Date(h.time);
        if (hDate < nowTime) continue;
        var timeStr = h.time.slice(11, 16);
        var isNow = (count === 0);
        var temp = Math.round(h.temp);
        hourlyHTML += '<div class="hour-item' + (isNow ? ' now' : '') + '">'
            + '<div class="h-time">' + (isNow ? 'Сейчас' : timeStr) + '</div>'
            + '<span class="h-icon">' + getWeatherIcon(h.code) + '</span>'
            + '<div class="h-temp">' + temp + '°</div>'
            + '</div>';
        count++;
    }
    document.getElementById('hourly').innerHTML = hourlyHTML;

    var dayN = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
    var weekHTML = '';
    for (var j = 0; j < data.daily.length; j++) {
        var d = data.daily[j];
        var dd = new Date(d.time);
        var isToday = (j === 0);
        var label = isToday ? 'Сегодня' : (j === 1 ? 'Завтра' : dayN[dd.getDay()] + ', ' + dd.getDate() + '.' + (dd.getMonth() + 1));
        weekHTML += '<div class="day-row">'
            + '<div class="day-name' + (isToday ? ' today' : '') + '">' + label + '</div>'
            + '<div class="day-icon">' + getWeatherIcon(d.code) + '</div>'
            + '<div class="day-desc">' + getWeatherDesc(d.code) + '</div>'
            + '<div class="day-rain">' + Math.round(d.rain) + '%</div>'
            + '<div class="day-temp"><span class="min">' + Math.round(d.min) + '°</span>' + Math.round(d.max) + '°</div>'
            + '</div>';
    }
    document.getElementById('forecastList').innerHTML = weekHTML;

    renderFishing(cur);
}

function renderFishing(cur) {
    var zones = [
        { name: 'Ладожское озеро', mod: 0 },
        { name: 'Финский залив', mod: 1 }
    ];
    var html = '';
    var temp = cur.temp;
    var press = cur.pressure;
    var wind = cur.wind;

    for (var k = 0; k < zones.length; k++) {
        var zone = zones[k];
        var score = 0;
        if (temp >= 10 && temp <= 22) score += 3;
        else if (temp >= 5 && temp <= 25) score += 1;
        if (press >= 1010 && press <= 1025) score += 3;
        else if (press >= 1000 && press <= 1030) score += 1;
        if (wind < 5) score += 3;
        else if (wind < 10) score += 1;
        score += zone.mod;

        var status = 'Слабый';
        var bg = 'rgba(139,149,168,0.15)';
        if (score >= 7) { status = 'Отличный'; bg = 'rgba(74,217,160,0.2)'; }
        else if (score >= 5) { status = 'Хороший'; bg = 'rgba(94,184,255,0.2)'; }
        else if (score >= 3) { status = 'Средний'; bg = 'rgba(255,184,74,0.2)'; }

        html += '<div class="fish-block">'
            + '<div class="ft">' + zone.name + '<span class="fish-status" style="background:' + bg + '">' + status + '</span></div>'
            + '<div class="fish-row"><span>Температура</span><span>' + Math.round(temp) + '°</span></div>'
            + '<div class="fish-row"><span>Давление</span><span>' + Math.round(press) + ' гПа</span></div>'
            + '<div class="fish-row"><span>Ветер</span><span>' + Math.round(wind) + ' м/с</span></div>'
            + '</div>';
    }
    document.getElementById('fishing').innerHTML = html;
}

function detectLocation() {
    if (!navigator.geolocation) {
        alert('Геолокация не поддерживается');
        return;
    }
    cityName.textContent = 'Определяю...';
    navigator.geolocation.getCurrentPosition(
        function(pos) {
            lat = pos.coords.latitude;
            lon = pos.coords.longitude;
            cityName.textContent = 'Ваше местоположение';
            loadWeather();
        },
        function() {
            alert('Не удалось определить. Показываю СПб.');
            resetToSPB();
        },
        { enableHighAccuracy: true, timeout: 10000 }
    );
}

function resetToSPB() {
    lat = 59.9386;
    lon = 30.3141;
    cityName.textContent = 'Санкт-Петербург';
    loadWeather();
}

// Запуск
var cached = loadCache();
if (cached) {
    if (cached.city) cityName.textContent = cached.city;
    renderAll(cached.data);
}
loadWeather();
setInterval(loadWeather, 15 * 60 * 1000);
</script>
</body>
</html>
