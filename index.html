<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#070b14" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#e8edf3" media="(prefers-color-scheme: light)">
<title>Weather Pro</title>
<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
<link rel="preconnect" href="https://nominatim.openstreetmap.org" crossorigin>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes growBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
:root{--bg-1:#070b14;--bg-2:#0d1424;--bg-top:#0f1a35;--bg-bottom:#04060a;--card:rgba(255,255,255,.045);--card-hi:rgba(255,255,255,.075);--border:rgba(255,255,255,.08);--border-hi:rgba(94,184,255,.35);--text:#f0f4fa;--text-2:#d5dde8;--dim:#8b95a8;--mute:#5e6b85;--accent:#5eb8ff;--warn:#ffcc7a;--err:#ff7a7a;--hero-grad-1:#fff;--hero-grad-2:#b8c5d6;--clock:#e5eaf3;--btn-text:#c5cdd9;--input-bg:rgba(0,0,0,.25);--results-bg:rgba(15,22,38,.98)}
@media (prefers-color-scheme:light){:root{--bg-1:#e8edf3;--bg-2:#d8e0ea;--bg-top:#f5f8fc;--bg-bottom:#dce3ed;--card:rgba(255,255,255,.75);--card-hi:rgba(255,255,255,.95);--border:rgba(0,0,0,.08);--border-hi:rgba(26,115,232,.4);--text:#0a1020;--text-2:#1f2a3d;--dim:#4a5568;--mute:#718096;--accent:#1a73e8;--warn:#d97706;--err:#dc2626;--hero-grad-1:#0a1020;--hero-grad-2:#4a5568;--clock:#1a2436;--btn-text:#2a3448;--input-bg:rgba(0,0,0,.04);--results-bg:rgba(255,255,255,.98)}}
body{min-height:100vh;background:linear-gradient(135deg,#0a1020,#070b14,#0d1424,#0a1020);background-size:300% 300%;animation:bgShift 80s ease infinite;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,Arial,sans-serif;display:flex;justify-content:center;align-items:flex-start;padding:20px 14px 80px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
@media (prefers-color-scheme:light){body{background:linear-gradient(135deg,#eef2f7,#e2e9f1,#eef2f7,#e8edf3);background-size:300% 300%}}
.container{width:100%;max-width:720px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:22px 24px;backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);box-shadow:0 20px 50px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05);animation:fadeUp .5s cubic-bezier(.16,1,.3,1) both;transition:border-color .3s ease,background .3s ease}
@media (prefers-color-scheme:light){.card{box-shadow:0 12px 30px rgba(0,0,0,.06),inset 0 1px 0 rgba(255,255,255,.5)}}
@media (hover:hover){.card:hover{border-color:var(--border-hi)}}
.search-wrap{position:relative;z-index:50}
.search-bar{display:flex;gap:8px}
.search-input-wrap{flex:1;position:relative}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:15px;pointer-events:none}
#searchInput{width:100%;padding:14px 44px;background:var(--input-bg);border:1px solid var(--border);border-radius:16px;color:var(--text);font-size:15px;font-family:inherit;outline:none;transition:all .25s ease}
#searchInput::placeholder{color:var(--mute)}
#searchInput:focus{border-color:rgba(94,184,255,.5);background:rgba(94,184,255,.06);box-shadow:0 0 0 4px rgba(94,184,255,.08)}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--card-hi);border:none;color:var(--dim);cursor:pointer;font-size:15px;display:none;align-items:center;justify-content:center;font-family:inherit}
.search-clear.show{display:flex}
.search-clear:hover{background:rgba(255,122,122,.2);color:var(--err)}
.search-btn{padding:14px 20px;background:linear-gradient(135deg,rgba(94,184,255,.18),rgba(124,140,255,.1));border:1px solid var(--border-hi);border-radius:16px;color:var(--accent);cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;touch-action:manipulation;transition:all .2s ease;flex-shrink:0}
.search-btn:hover{transform:translateY(-1px)}
.search-btn:active{transform:scale(.97)}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--results-bg);border:1px solid var(--border);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.4);overflow:hidden;z-index:100;max-height:400px;overflow-y:auto;display:none}
.search-results.show{display:block;animation:fadeUp .2s ease}
.result-group-label{padding:8px 16px 4px;font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;background:var(--card-hi)}
.result-item{padding:11px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s ease;display:flex;gap:12px;align-items:flex-start}
.result-item:last-child{border-bottom:none}
.result-item:hover{background:var(--card-hi)}
.result-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.result-body{flex:1;min-width:0}
.result-name{font-size:13.5px;font-weight:600;color:var(--text);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-detail{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-type{font-size:10.5px;color:var(--accent);background:rgba(94,184,255,.12);padding:2px 7px;border-radius:6px;font-weight:600;white-space:nowrap;align-self:flex-start}
.search-loading,.search-empty{padding:20px;text-align:center;color:var(--dim);font-size:13px;line-height:1.5}
.search-history{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.search-history:empty{display:none}
.search-history-label{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-right:4px}
.history-chip{padding:5px 11px;background:var(--card-hi);border:1px solid var(--border);border-radius:20px;color:var(--dim);font-size:11.5px;cursor:pointer;font-family:inherit;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-chip:hover{border-color:var(--border-hi);color:var(--accent)}
.history-chip.spb{border-color:var(--border-hi);color:var(--accent);font-weight:600}
.header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.loc-info h1{font-size:30px;font-weight:700;letter-spacing:-.6px;line-height:1.15;background:linear-gradient(135deg,var(--hero-grad-1) 0%,var(--hero-grad-2) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.loc-sub{font-size:12px;color:var(--mute);margin-top:6px;font-variant-numeric:tabular-nums}
.clock-block{text-align:right;flex-shrink:0}
.clock{font-size:30px;font-weight:200;color:var(--clock);font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1}
.clock-date{font-size:12px;color:var(--dim);margin-top:5px}
.clock-updated{font-size:11px;color:var(--mute);margin-top:3px}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.btn{padding:11px 14px;background:var(--card);border:1px solid var(--border);border-radius:14px;color:var(--btn-text);font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;touch-action:manipulation;transition:all .2s ease;position:relative}
.btn:hover{background:var(--card-hi);color:var(--text);border-color:var(--border-hi);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.active{background:linear-gradient(135deg,rgba(94,184,255,.25),rgba(124,140,255,.15));border-color:rgba(94,184,255,.55);color:var(--accent);font-weight:700}
.btn.spinning{pointer-events:none;opacity:.75}
.btn.spinning::after{content:"";position:absolute;right:12px;top:50%;width:12px;height:12px;margin-top:-6px;border:2px solid var(--border-hi);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.current-hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.hero-icon{width:100px;height:100px}
.hero-icon svg{width:100%;height:100%;display:block}
.hero-temp{font-size:74px;font-weight:200;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-3px}
.hero-desc{font-size:16px;color:var(--text-2);margin-top:8px;font-weight:500}
.hero-feels{font-size:13px;color:var(--dim);margin-top:4px}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:18px}
.metric{background:var(--card-hi);border:1px solid var(--border);border-radius:14px;padding:12px 14px}
.metric-label{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.metric-value{font-size:18px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums}
.metric-hint{font-size:11px;color:var(--dim);margin-top:3px}
.metric-hint.pressure-good{color:#4ad9a0}
.metric-hint.pressure-bad{color:var(--warn)}
.section-title{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:2px;margin-bottom:14px}
.hourly-scroll{display:flex;gap:4px;overflow-x:auto;padding:4px 0 12px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.hourly-scroll::-webkit-scrollbar{height:3px}
.hourly-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.hour-cell{flex-shrink:0;min-width:66px;padding:12px 6px;text-align:center;border-radius:14px}
.hour-cell.now{background:rgba(94,184,255,.12);border:1px solid var(--border-hi)}
.hour-cell .time{font-size:11.5px;color:var(--dim);margin-bottom:8px;font-variant-numeric:tabular-nums}
.hour-cell.now .time{color:var(--accent);font-weight:700}
.hour-cell .icon{width:26px;height:26px;margin:0 auto 6px}
.hour-cell .icon svg{width:100%;height:100%;display:block}
.hour-cell .temp{font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums}
.hour-cell .rain{font-size:10px;color:var(--accent);margin-top:2px;font-variant-numeric:tabular-nums}
.day-item{display:grid;grid-template-columns:110px 34px 1fr 56px 90px;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.day-item:last-child{border-bottom:none}
.day-name{color:var(--text-2)}
.day-name.today{color:var(--accent);font-weight:700}
.day-icon{width:28px;height:28px}
.day-icon svg{width:100%;height:100%;display:block}
.day-desc{color:var(--dim);font-size:12.5px}
.day-rain{color:var(--accent);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.day-temp{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.day-temp .min{color:var(--dim);font-weight:400;margin-right:6px;font-size:13px}
.moon-block{display:flex;gap:20px;align-items:center}
.moon-svg{width:70px;height:70px;flex-shrink:0}
.moon-info{flex:1}
.moon-name{font-size:15px;font-weight:600;margin-bottom:4px}
.moon-hint{font-size:12.5px;color:var(--dim);line-height:1.5}
.fishing-wrap{background:linear-gradient(135deg,rgba(74,217,160,.06),rgba(94,184,255,.03));border:1px solid rgba(74,217,160,.14);border-radius:16px;padding:16px 18px}
.fish-summary{display:flex;gap:14px;align-items:center;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--border)}
.fish-score-big{font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.fish-score-text{font-size:12.5px;color:var(--dim);margin-top:4px}
.fish-score-label{font-size:15px;font-weight:600;margin-top:2px}
.fish-row{display:grid;grid-template-columns:130px 1fr 42px;gap:12px;align-items:center;padding:5px 0;font-size:12.5px}
.fish-row-name{color:var(--text-2)}
.fish-row-bar{height:6px;background:var(--card-hi);border-radius:3px;overflow:hidden}
.fish-row-bar-fill{height:100%;border-radius:3px;transform-origin:left center;animation:growBar .7s cubic-bezier(.16,1,.3,1) both}
.fish-row-score{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.saved-row{display:flex;flex-wrap:wrap;gap:6px}
.saved-chip{padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--dim);font-size:12.5px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.saved-chip:hover{border-color:var(--border-hi);color:var(--accent)}
.saved-chip.active{background:rgba(94,184,255,.15);border-color:var(--border-hi);color:var(--accent);font-weight:600}
.saved-chip .del{background:transparent;border:none;color:inherit;opacity:.5;cursor:pointer;font-size:14px;padding:0;font-family:inherit}
.saved-chip .del:hover{opacity:1;color:var(--err)}
.saved-chip.locked .del{display:none}
.notice{padding:12px 16px;border-radius:12px;font-size:12.5px;line-height:1.5}
.notice.warn{background:rgba(255,184,74,.08);border:1px solid rgba(255,184,74,.25);color:var(--warn)}
.notice.err{background:rgba(255,100,100,.08);border:1px solid rgba(255,100,100,.25);color:var(--err)}
.notice button{display:block;margin-top:8px;background:var(--card-hi);border:1px solid var(--border);color:inherit;padding:7px 12px;border-radius:9px;font-family:inherit;font-size:12px;cursor:pointer}
.notice button:hover{border-color:var(--border-hi)}
.loading{text-align:center;color:var(--dim);padding:30px;font-size:13px}
.sun-row{display:flex;gap:14px;margin-top:14px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.sun-row b{color:var(--text)}
@media (max-width:768px),(pointer:coarse){
body{animation:none;background:var(--bg-1);background-image:radial-gradient(ellipse at top,var(--bg-top) 0%,var(--bg-1) 60%,var(--bg-bottom) 100%);padding:14px 10px 60px}
.card{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--card);box-shadow:0 12px 30px rgba(0,0,0,.4);padding:18px;border-radius:20px}
@media (prefers-color-scheme:light){.card{box-shadow:0 8px 20px rgba(0,0,0,.06)}}
.loc-info h1{font-size:23px}
.clock{font-size:22px}
.hero-temp{font-size:58px;letter-spacing:-2px}
.hero-icon{width:80px;height:80px}
.current-hero{grid-template-columns:auto 1fr;gap:14px}
.metric-grid{grid-template-columns:1fr 1fr}
.day-item{grid-template-columns:76px 30px 1fr 52px}
.day-item .day-rain{display:none}
.fish-row{grid-template-columns:100px 1fr 36px;gap:8px;font-size:12px}
#searchInput{font-size:15px}
.search-btn{padding:14px 16px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}body{animation:none!important}}
</style>
</head>
<body>
<div class="container">

<div class="card search-wrap">
<div class="search-bar">
<div class="search-input-wrap">
<span class="search-icon">🔍</span>
<input type="text" id="searchInput" placeholder="Ладога, Финский, река Ловать..." autocomplete="off" spellcheck="false">
<button class="search-clear" id="searchClear" onclick="clearSearch()">×</button>
</div>
<button class="search-btn" onclick="doSearchNow()">Найти</button>
</div>
<div class="search-results" id="searchResults"></div>
<div class="search-history" id="searchHistory"></div>
</div>

<div class="card">
<div class="header">
<div class="loc-info">
<h1 id="cityName">Санкт-Петербург</h1>
<div class="loc-sub" id="coords"></div>
</div>
<div class="clock-block">
<div class="clock" id="clock">--:--</div>
<div class="clock-date" id="currentDate">--</div>
<div class="clock-updated" id="lastUpdated"></div>
</div>
</div>
<div class="toolbar">
<button class="btn" id="btnGps" onclick="detectLocation()">📍 Моё местоположение</button>
<button class="btn active" id="btnSpb" onclick="goToSPB()">🏛 Санкт-Петербург</button>
<button class="btn" id="btnSave" onclick="saveCurrentLocation()">⭐ Сохранить место</button>
<button class="btn" id="refreshBtn" onclick="loadWeather(true)">↻ Обновить</button>
</div>
</div>

<div id="geoBox"></div>
<div id="statusBox"></div>
<div id="errorBox" class="notice err" style="display:none;"></div>

<div class="card">
<div class="current-hero">
<div class="hero-icon" id="currentIcon"></div>
<div>
<div class="hero-temp" id="currentTemp">--</div>
<div class="hero-desc" id="currentDesc">Загрузка...</div>
<div class="hero-feels" id="feelsLine"></div>
</div>
</div>
<div class="metric-grid">
<div class="metric"><div class="metric-label">Ветер</div><div class="metric-value" id="wind">--</div><div class="metric-hint" id="windHint"></div></div>
<div class="metric"><div class="metric-label">Давление</div><div class="metric-value" id="pressure">--</div><div class="metric-hint" id="pressureTrend"></div></div>
<div class="metric"><div class="metric-label">Влажность</div><div class="metric-value" id="humidity">--</div><div class="metric-hint" id="dewHint"></div></div>
<div class="metric"><div class="metric-label">УФ-индекс</div><div class="metric-value" id="uv">--</div><div class="metric-hint" id="uvHint"></div></div>
<div class="metric"><div class="metric-label">Осадки</div><div class="metric-value" id="precip">--</div><div class="metric-hint" id="precipHint"></div></div>
<div class="metric"><div class="metric-label">Облачность</div><div class="metric-value" id="clouds">--</div><div class="metric-hint" id="cloudsHint"></div></div>
</div>
<div class="sun-row">
<span>Восход: <b id="sunrise">--:--</b></span>
<span>Закат: <b id="sunset">--:--</b></span>
<span>День: <b id="dayLength">--</b></span>
</div>
</div>

<div class="card">
<div class="section-title">Почасовой прогноз</div>
<div id="hourly" class="hourly-scroll"><div class="loading">Загрузка...</div></div>
</div>

<div class="card">
<div class="section-title">Прогноз на 7 дней</div>
<div id="daily"><div class="loading">Загрузка...</div></div>
</div>

<div class="card">
<div class="section-title">Луна</div>
<div class="moon-block" id="moonBlock"><div class="loading">Загрузка...</div></div>
</div>

<div class="card">
<div class="section-title">Прогноз клёва</div>
<div id="fishing"><div class="loading">Загрузка...</div></div>
</div>

<div class="card">
<div class="section-title">Сохранённые места</div>
<div class="saved-row" id="savedRow"></div>
</div>

</div>

<script>
/* ============ ЗАЩИТА ============ */
(function(){'use strict';
var a=['useevaana031-del.github.io','localhost','127.0.0.1'];
var h=location.hostname||'',p=location.protocol||'',ok=false;
for(var i=0;i<a.length;i++){if(h===a[i]||h.indexOf(a[i])!==-1){ok=true;break}}
if(h==='localhost'||h==='127.0.0.1'||p==='file:')ok=true;

try{console.log('%c⚠️ СТОП, ИШАК','color:#ff7a7a;font-size:32px;font-weight:bold');console.log('%cНе получится украсть код. Придумай своё.','color:#ffcc7a;font-size:14px;font-weight:600')}catch(e){}
})();

/* ============ КОНСТАНТЫ ============ */
var SPB_LAT=59.9386,SPB_LON=30.3141;
var SPB_BBOX={minLat:59.60,maxLat:60.35,minLon:29.30,maxLon:30.90};
var lat=SPB_LAT,lon=SPB_LON;
var CACHE_KEY='wp_v14',LOCS_KEY='wl_v14',HIST_KEY='wh_v14',GEO_PREFIX='wg_';
var REFRESH_MS=600000,TICK_MS=30000,TIMEOUT=15000;

var cityNameEl=document.getElementById('cityName'),coordsEl=document.getElementById('coords');
var statusBox=document.getElementById('statusBox'),errorBox=document.getElementById('errorBox');
var geoBox=document.getElementById('geoBox'),refreshBtn=document.getElementById('refreshBtn');
var btnGps=document.getElementById('btnGps'),btnSpb=document.getElementById('btnSpb');

var lastData=null,lastUpdateMs=0,lastHourRendered='',lastTemp=null,reqToken=0;
var locations=[],currentLocIdx=0,searchAbort=null,searchTimer=null;
var activeMode='spb';

/* ============ UTILS ============ */
function pad2(n){return(n<10?'0':'')+n}
function isNum(v){return typeof v==='number'&&isFinite(v)}
function fmt(v,s){return isNum(v)?(Math.round(v)+(s||'')):'--'}
function validCoord(la,lo){return isNum(la)&&isNum(lo)&&la>=-90&&la<=90&&lo>=-180&&lo<=180}
function inSpbBox(la,lo){return la>=SPB_BBOX.minLat&&la<=SPB_BBOX.maxLat&&lo>=SPB_BBOX.minLon&&lo<=SPB_BBOX.maxLon}
function safeDate(str){if(!str)return null;var p=String(str).split('-');if(p.length<3)return null;var y=parseInt(p[0],10),m=parseInt(p[1],10),d=parseInt(p[2],10);if(isNaN(y)||isNaN(m)||isNaN(d))return null;return new Date(y,m-1,d)}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function hPaToMmHg(hPa){return isNum(hPa)?Math.round(hPa*0.750062):null}
function fetchT(url,ms){return new Promise(function(resolve,reject){var done=false;var t=setTimeout(function(){if(done)return;done=true;reject(new Error('timeout'))},ms);fetch(url,{cache:'no-store'}).then(function(r){if(done)return;done=true;clearTimeout(t);resolve(r)}).catch(function(e){if(done)return;done=true;clearTimeout(t);reject(e)})})}

/* ============ CLOCK ============ */
function updateClock(){var d=new Date();document.getElementById('clock').textContent=pad2(d.getHours())+':'+pad2(d.getMinutes())}
function updateDate(){var n=new Date();var days=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];var months=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];document.getElementById('currentDate').textContent=days[n.getDay()]+', '+n.getDate()+' '+months[n.getMonth()]}
function updateLastUpdated(){var el=document.getElementById('lastUpdated');if(!lastUpdateMs){el.textContent='';return}var s=Math.round((Date.now()-lastUpdateMs)/1000);var t;if(s<30)t='только что';else if(s<60)t=s+' сек назад';else if(s<3600)t=Math.round(s/60)+' мин назад';else t=Math.round(s/3600)+' ч назад';el.textContent='Обновлено '+t}
function updateCoords(){if(Math.abs(lat-SPB_LAT)<0.01&&Math.abs(lon-SPB_LON)<0.01)coordsEl.textContent='';else coordsEl.textContent=lat.toFixed(4)+', '+lon.toFixed(4)}
function nowHourKey(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+'T'+pad2(d.getHours())}

/* ============ CACHE / LOCS / HIST ============ */
function saveCache(d,s){try{localStorage.setItem(CACHE_KEY,JSON.stringify({d:d,s:s,ts:Date.now(),city:cityNameEl.textContent,lat:lat,lon:lon}))}catch(e){}}
function loadCache(){try{var raw=localStorage.getItem(CACHE_KEY);if(!raw)return null;var o=JSON.parse(raw);if(!o||!o.ts||!o.d)return null;if(Date.now()-o.ts>24*3600000)return null;if(Math.abs(o.lat-lat)>0.5||Math.abs(o.lon-lon)>0.5)return null;return o}catch(e){return null}}
function loadLocations(){try{var r=localStorage.getItem(LOCS_KEY);if(r)locations=JSON.parse(r)||[]}catch(e){locations=[]}
var hasSPB=false;for(var i=0;i<locations.length;i++){if(Math.abs(locations[i].lat-SPB_LAT)<0.001&&Math.abs(locations[i].lon-SPB_LON)<0.001){hasSPB=true;break}}
if(!hasSPB)locations.unshift({name:'Санкт-Петербург',lat:SPB_LAT,lon:SPB_LON,locked:true});saveLocations();renderSavedRow()}
function saveLocations(){try{localStorage.setItem(LOCS_KEY,JSON.stringify(locations))}catch(e){}}
function renderSavedRow(){var el=document.getElementById('savedRow');if(!locations.length){el.innerHTML='<div style="color:var(--mute);font-size:12.5px">Пока пусто.</div>';return}
var html='';for(var i=0;i<locations.length;i++){var l=locations[i];var isSPB=Math.abs(l.lat-SPB_LAT)<0.001&&Math.abs(l.lon-SPB_LON)<0.001;var active=(activeMode==='saved'&&i===currentLocIdx)?' active':'';var locked=isSPB?' locked':'';html+='<div class="saved-chip'+active+locked+'" onclick="selectLocation('+i+')">'+esc(l.name)+'<button class="del" onclick="event.stopPropagation(); removeLocation('+i+')">×</button></div>'}
el.innerHTML=html}
function selectLocation(i){if(i<0||i>=locations.length)return;currentLocIdx=i;var l=locations[i];lat=l.lat;lon=l.lon;cityNameEl.textContent=l.name;updateCoords();document.getElementById('searchInput').value=l.name;document.getElementById('searchClear').classList.add('show');document.getElementById('searchResults').classList.remove('show');addToHistory({name:l.name,lat:l.lat,lon:l.lon});var isSPB=Math.abs(l.lat-SPB_LAT)<0.001&&Math.abs(l.lon-SPB_LON)<0.001;setActiveMode(isSPB?'spb':'saved');loadWeather(true)}
function removeLocation(i){var l=locations[i];if(!l)return;if(Math.abs(l.lat-SPB_LAT)<0.001&&Math.abs(l.lon-SPB_LON)<0.001)return;if(locations.length<=1)return;locations.splice(i,1);if(currentLocIdx>=locations.length)currentLocIdx=locations.length-1;saveLocations();renderSavedRow()}
function saveCurrentLocation(){var name=prompt('Название:',cityNameEl.textContent);if(!name||!name.trim())return;name=name.trim();for(var i=0;i<locations.length;i++){if(Math.abs(locations[i].lat-lat)<0.001&&Math.abs(locations[i].lon-lon)<0.001){locations[i].name=name;saveLocations();renderSavedRow();return}}locations.push({name:name,lat:lat,lon:lon});saveLocations();currentLocIdx=locations.length-1;setActiveMode('saved');loadWeather(true)}

/* ============ ЗАПРОС ПОГОДЫ (с прокси-fallback) ============ */
function buildWeatherUrl(){
  return 'https://api.open-meteo.com/v1/forecast'
    +'?latitude='+lat.toFixed(4)+'&longitude='+lon.toFixed(4)
    +'&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m,pressure_msl,uv_index,cloud_cover,dew_point_2m,precipitation'
    +'&hourly=temperature_2m,weather_code,precipitation_probability,pressure_msl'
    +'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset'
    +'&timezone=auto&forecast_days=7';
}

async function tryFetch(url,ms){
  return new Promise(function(resolve,reject){
    var done=false;
    var t=setTimeout(function(){if(done)return;done=true;reject(new Error('timeout'))},ms);
    fetch(url,{cache:'no-store'}).then(function(r){
      if(done)return;done=true;clearTimeout(t);
      if(!r.ok)reject(new Error('HTTP '+r.status));
      else resolve(r);
    }).catch(function(e){
      if(done)return;done=true;clearTimeout(t);
      reject(e);
    });
  });
}

async function fetchWeather(){
  var direct=buildWeatherUrl();
  var sources=[
    {name:'direct',url:direct},
    {name:'allorigins',url:'https://api.allorigins.win/raw?url='+encodeURIComponent(direct)},
    {name:'codetabs',url:'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(direct)}
  ];
  for(var i=0;i<sources.length;i++){
    var src=sources[i];
    try{
      console.log('[Weather] Пробую '+src.name+'...');
      var r=await tryFetch(src.url,TIMEOUT);
      var text=await r.text();
      var d=JSON.parse(text);
      if(d.reason)throw new Error(d.reason);
      if(!d.current||!d.hourly||!d.daily)throw new Error('Пустой ответ');
      console.log('[Weather] OK через '+src.name+', temp='+d.current.temperature_2m);
      return d;
    }catch(e){
      console.warn('[Weather] '+src.name+' не сработал: '+e.message);
    }
  }
  throw new Error('Все источники недоступны');
}

/* ============ MOON ============ */
function moonPhase(date){var d=date||new Date();var y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();
var jd=367*y-Math.floor(7*(y+Math.floor((m+9)/12))/4)+Math.floor(275*m/9)+day+1721013.5;
var daysSince=jd-2451549.5;var syn=29.530588853;
var age=((daysSince%syn)+syn)%syn;
var illum=(1-Math.cos(2*Math.PI*age/syn))/2;var phase=age/syn;
var names=[{max:0.03,name:'Новолуние',hint:'Рыба активна, но мало'},{max:0.22,name:'Растущий серп',hint:'Хороший клёв'},{max:0.28,name:'Первая четверть',hint:'Средний клёв'},{max:0.47,name:'Растущая луна',hint:'Хороший клёв'},{max:0.53,name:'Полнолуние',hint:'Слабый клёв'},{max:0.72,name:'Убывающая луна',hint:'Хороший клёв'},{max:0.78,name:'Последняя четверть',hint:'Средний клёв'},{max:0.97,name:'Убывающий серп',hint:'Хороший клёв'},{max:1.01,name:'Новолуние',hint:'Рыба активна, но мало'}];
var nn=names[names.length-1];for(var i=0;i<names.length;i++)if(phase<=names[i].max){nn=names[i];break}
return{age:age,illum:illum,phase:phase,name:nn.name,hint:nn.hint}}

/* ============ HINTS ============ */
function uvHint(uv){if(!isNum(uv))return'--';if(uv<3)return'Низкий';if(uv<6)return'Умеренный, SPF 15+';if(uv<8)return'Высокий, SPF 30+';if(uv<11)return'Очень высокий';return'Экстремальный'}
function windDir(d){if(!isNum(d))return'';var dirs=['С','СВ','В','ЮВ','Ю','ЮЗ','З','СЗ'];return dirs[Math.round(d/45)%8]}
function pressureTrend(hourly){if(!hourly||!Array.isArray(hourly.pressure_msl)||hourly.pressure_msl.length<4)return{text:'',hint:''};var a=hourly.pressure_msl.slice(0,4).filter(isNum);if(a.length<2)return{text:'',hint:''};var diff=a[a.length-1]-a[0];if(Math.abs(diff)<0.8)return{text:'→',hint:'Стабильное'};if(diff>0)return{text:'↑',hint:'Растёт'};return{text:'↓',hint:'Падает'}}
function cloudsHint(c){if(!isNum(c))return'';if(c<15)return'Ясно';if(c<40)return'Небольшая';if(c<70)return'Значительная';return'Сплошная'}

  if(lastTemp===null||isCached||!isNum(t))te.textContent=fmt(t,'°');
  else{var from=lastTemp,to=t,start=performance.now(),dur=500;(function anim(now){var p=Math.min(1,(now-start)/dur);var e=1-Math.pow(1-p,3);te.textContent=Math.round(from+(to-from)*e)+'°';if(p<1)requestAnimationFrame(anim)})(performance.now())}

  document.getElementById('windHint').textContent=windDir(c.wind_direction_10m)+' · порывы '+fmt(c.wind_gusts_10m,' м/с');

  document.getElementById('humidity').textContent=fmt(c.relative_humidity_2m,'%');
  document.getElementById('dewHint').textContent='Точка росы '+fmt(c.dew_point_2m,'°');
  document.getElementById('uv').textContent=isNum(c.uv_index)?Math.round(c.uv_index):'--';
  document.getElementById('uvHint').textContent=uvHint(c.uv_index);

  if(data.daily&&data.daily.sunrise&&data.daily.sunrise[0]){

  }

function renderHourly(data){
  var el=document.getElementById('hourly');
  if(!data.hourly||!Array.isArray(data.hourly.time)||!data.hourly.time.length){el.innerHTML='<div class="loading">Нет данных</div>';return}
  var temp=data.hourly.temperature_2m||[];
  var codes=data.hourly.weather_code||[];
  var prob=data.hourly.precipitation_probability||[];
  var key=(data.current.time||'').slice(0,13)||nowHourKey();
  var start=0;
  for(var i=0;i<data.hourly.time.length;i++){if((data.hourly.time[i]||'').slice(0,13)>=key){start=i;break}}
  var sp=el.scrollLeft,html='',count=0;
  for(var j=start;j<data.hourly.time.length&&count<96;j++){
    var t=data.hourly.time[j];var tt=temp[j];var cc=codes[j];
    var rr=(typeof prob[j]==='number')?prob[j]:null;
    var timeStr=(t||'').slice(11,16);var isNow=(count===0);
    html+='<div class="hour-cell'+(isNow?' now':'')+'"><div class="time">'+(isNow?'Сейчас':timeStr)+'</div><div class="icon">'+svgIcon(fixCode(cc,tt))+'</div><div class="temp">'+fmt(tt,'°')+'</div><div class="rain">'+(rr===null?'':fmt(rr,'%'))+'</div></div>';
    count++;
  }
  el.innerHTML=html||'<div class="loading">Нет данных</div>';el.scrollLeft=sp;lastHourRendered=key;
}

function renderDaily(data){
  if(!data.daily||!Array.isArray(data.daily.time)){document.getElementById('daily').innerHTML='<div class="loading">Нет данных</div>';return}
  var dN=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  var mx=data.daily.temperature_2m_max||[];var mn=data.daily.temperature_2m_min||[];
  var cc=data.daily.weather_code||[];var rr=data.daily.precipitation_probability_max||[];
  var html='';
  for(var j=0;j<data.daily.time.length;j++){
    var d=safeDate(data.daily.time[j]);var isToday=(j===0);var label;
    if(isToday)label='Сегодня';else if(j===1)label='Завтра';else if(d)label=dN[d.getDay()]+', '+d.getDate()+'.'+(d.getMonth()+1);else label='—';
    var tmax=mx[j],tmin=mn[j],code=cc[j],rain=rr[j];
    var avg=(isNum(tmax)&&isNum(tmin))?(tmax+tmin)/2:tmax;
    html+='<div class="day-item"><div class="day-name'+(isToday?' today':'')+'">'+label+'</div><div class="day-icon">'+svgIcon(fixCode(code,avg))+'</div><div class="day-desc">'+descFor(fixCode(code,avg))+'</div><div class="day-rain">'+(isNum(rain)?fmt(rain,'%'):'')+'</div><div class="day-temp"><span class="min">'+fmt(tmin,'°')+'</span>'+fmt(tmax,'°')+'</div></div>';
  }
  document.getElementById('daily').innerHTML=html||'<div class="loading">Нет данных</div>';
}

function renderMoon(){
  var m=moonPhase(new Date());var illum=m.illum,waxing=m.phase<0.5,phase=m.phase;
  var svg='<svg viewBox="0 0 70 70" xmlns="http://www.w3.org/2000/svg">';
  svg+='<circle cx="35" cy="35" r="28" fill="#2a3a52"/>';
  var k=Math.cos(2*Math.PI*phase);var rx=Math.abs(k)*28;
  if(illum<0.03)svg+='<circle cx="35" cy="35" r="28" fill="#3a4a62" opacity="0.4"/>';
  else if(illum>0.97)svg+='<circle cx="35" cy="35" r="28" fill="#e8eaf0"/>';
  else if(waxing)svg+='<path d="M35 7 A28 28 0 0 1 35 63 A'+rx+' 28 0 0 0 35 7 Z" fill="#e8eaf0"/>';
  else svg+='<path d="M35 7 A28 28 0 0 0 35 63 A'+rx+' 28 0 0 1 35 7 Z" fill="#e8eaf0"/>';
  svg+='</svg>';
  document.getElementById('moonBlock').innerHTML='<div class="moon-svg">'+svg+'</div><div class="moon-info"><div class="moon-name">'+m.name+'</div><div class="moon-hint">Освещённость: <b>'+Math.round(illum*100)+'%</b><br>Возраст: '+Math.round(m.age)+' дн.<br>'+m.hint+'</div></div>';
}

function scoreFish(f,temp,press,wind,month,moon){var s=0;
if(temp>=f.tMin&&temp<=f.tMax)s+=40;else if(temp>=f.tMin-3&&temp<=f.tMax+3)s+=20;else s+=3;
if(f.press==='stable'){if(press>=1010&&press<=1025)s+=25;else if(press>=1000&&press<=1030)s+=12;else s+=3}else{if(press>=1000&&press<=1030)s+=22;else s+=10}
if(wind<=f.windMax*0.5)s+=12;else if(wind<=f.windMax)s+=6;else s+=2;
if(f.active.indexOf(month)>=0)s+=10;
if(moon){if(f.moon==='any')s+=5;else if(f.moon==='good_new'&&moon.illum<0.25)s+=8;else if(f.moon==='good_full'&&moon.illum>0.75)s+=8;else if(f.moon==='good_waning'&&moon.phase>0.5)s+=8;else s+=2}
return Math.max(0,Math.min(100,Math.round(s)))}
function scoreColor(s){if(s>=80)return'#4ad9a0';if(s>=60)return'#8ee86a';if(s>=40)return'#ffcc7a';if(s>=20)return'#ff9a5e';return'#ff7a7a'}
function scoreLabel(s){if(s>=80)return'Отличный клёв';if(s>=60)return'Хороший клёв';if(s>=40)return'Средний клёв';if(s>=20)return'Слабый клёв';return'Плохой клёв'}
function fishBar(s){if(s>=80)return'linear-gradient(90deg,#3ac48a,#4ad9a0)';if(s>=60)return'linear-gradient(90deg,#6dc75a,#8ee86a)';if(s>=40)return'linear-gradient(90deg,#e8b45a,#ffcc7a)';if(s>=20)return'linear-gradient(90deg,#e87a4a,#ff9a5e)';return'linear-gradient(90deg,#e05555,#ff7a7a)'}
function renderFishing(c){var temp=isNum(c.temperature_2m)?c.temperature_2m:15;var press=isNum(c.pressure_msl)?c.pressure_msl:1013;var wind=isNum(c.wind_speed_10m)?c.wind_speed_10m:3;
var month=new Date().getMonth()+1;var moon=moonPhase(new Date());
var scored=FISH.map(function(f){return{name:f.name,score:scoreFish(f,temp,press,wind,month,moon)}}).sort(function(a,b){return b.score-a.score});
var top=Math.min(5,scored.length);var avg=0;for(var i=0;i<top;i++)avg+=scored[i].score;avg=Math.round(avg/top);
var html='<div class="fishing-wrap">';
html+='<div class="fish-summary"><div><div class="fish-score-big" style="color:'+scoreColor(avg)+'">'+avg+'</div><div class="fish-score-text">средний клёв</div></div><div style="flex:1"><div class="fish-score-label" style="color:'+scoreColor(avg)+'">'+scoreLabel(avg)+'</div><div style="font-size:12px;color:var(--dim);margin-top:4px">Темп '+Math.round(temp)+'° · Давл '+Math.round(press)+' гПа · Ветер '+Math.round(wind)+' м/с · '+moon.name+'</div></div></div>';
for(var k=0;k<scored.length;k++){var f=scored[k];html+='<div class="fish-row"><span class="fish-row-name">'+f.name+'</span><div class="fish-row-bar"><div class="fish-row-bar-fill" style="width:'+f.score+'%;background:'+fishBar(f.score)+'"></div></div><span class="fish-row-score" style="color:'+scoreColor(f.score)+'">'+f.score+'</span></div>'}
html+='</div>';document.getElementById('fishing').innerHTML=html}

/* ============ MAIN ============ */
async function loadWeather(force){
  if(!force&&document.hidden)return;
  if(!force&&lastUpdateMs&&(Date.now()-lastUpdateMs)<300000){updateLastUpdated();return}
  reqToken++;var tok=reqToken;
  updateDate();updateClock();
  errorBox.style.display='none';
  statusBox.innerHTML='';
  refreshBtn.classList.add('spinning');
  var result=null;
  try{
    var d=await fetchWeather();
    result={data:d,source:'Open-Meteo'};
  }catch(e){
    console.warn('[Weather] Ошибка:',e.message);
  }
  if(tok!==reqToken){refreshBtn.classList.remove('spinning');return}
  if(!result){
    refreshBtn.classList.remove('spinning');
    var cached=loadCache();
    if(cached){
      var age=Math.round((Date.now()-cached.ts)/60000);
      if(cached.city)cityNameEl.textContent=cached.city;
      lastData=cached.d;lastUpdateMs=cached.ts;
      try{renderAll(cached.d,true)}catch(e){}
      updateCoords();
      statusBox.innerHTML='<div class="card notice warn">Нет свежих данных, показаны старые ('+age+' мин).</div>';
    }else{
      errorBox.style.display='block';
      errorBox.textContent='Не удалось получить данные. Проверь интернет.';
    }
    return;
  }
  refreshBtn.classList.remove('spinning');
  lastData=result.data;lastUpdateMs=Date.now();lastHourRendered='';
  try{renderAll(result.data,false)}catch(e){console.warn('renderAll:',e.message)}
  updateCoords();saveCache(result.data,result.source);updateLastUpdated();
}

/* ============ TICK ============ */
function tick(){updateClock();updateDate();updateLastUpdated();
if(lastData&&lastData.hourly){var key=nowHourKey();if(lastHourRendered&&key!==lastHourRendered)renderHourly(lastData)}
if(!document.hidden&&lastUpdateMs&&(Date.now()-lastUpdateMs)>REFRESH_MS)loadWeather(false)}
document.addEventListener('visibilitychange',function(){if(!document.hidden){updateClock();updateLastUpdated();if(lastUpdateMs&&(Date.now()-lastUpdateMs)>300000)loadWeather(false)}});
window.addEventListener('online',function(){loadWeather(true)});
window.addEventListener('offline',function(){statusBox.innerHTML='<div class="card notice warn">Нет интернета.</div>'});

lat=curLoc.lat;lon=curLoc.lon;

document.getElementById('searchClear').classList.add('show');
updateCoords();renderHistory();
setActiveMode('spb');
checkGeoPerm(function(s){renderGeoBox(s)});
loadWeather(true);
setInterval(tick,TICK_MS);
